# Embedding model x chunking strategy comparison. Each model/strategy pair is one experiment named
# <model label>-<strategy> (so it is also the Qdrant collection name). Only the model and the strategy
# vary; everything under `shared` is identical across all of them.
#
# Run (inside the code container; progress is in the Dagster UI and data/matrix.log):
#   docker compose exec -d dagster-code sh -c "python -m rag_lab.experiments run experiments/matrix.yaml > data/matrix.log 2>&1"
# Preview without running:
#   docker compose exec dagster-code python -m rag_lab.experiments run experiments/matrix.yaml --dry-run

documents: [aiayn.pdf] # file names in data/raw; "all" for every PDF there

models: # label: Ollama model. Each model runs at its native vector size.
  q3-0-6b: qwen3-embedding:0.6b
  q3-4b: qwen3-embedding:4b
  q3-8b: qwen3-embedding:8b

strategies: [hybrid, hierarchical, fixed, recursive, semantic]

shared:
  chunk:
    max_tokens: 512
    overlap: 64 # applies to the `fixed` strategy only; the others get 0
    table_handling: markdown
  # parse, embed and index sections work the same way; omitted ones use the defaults.

benchmark: # passed to search_benchmark as its run config
  top_k: 10
  repeats: 5
